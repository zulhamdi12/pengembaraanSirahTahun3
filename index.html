<!doctype html>
<html lang="ms">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Pengembaraan Sirah Tahun 3</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F3EBDD; --surface:#FFFDF8; --ink:#2B2118; --muted:#6B5B4B; --line:#E3D5BE;
  --brand:#0F6B5A; --brand-ink:#FFFFFF; --brand-shadow:#0A4A3E; --gold:#E8A317; --sand:#E9C98F;
  --ok:#23824A; --ok-bg:#DDF3E5; --bad:#C8452F; --bad-bg:#FBE1DC; --note:#FFF1CF;
  --path:#B9884A;
  color-scheme:light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#17130F; --surface:#241D17; --ink:#F3EBDD; --muted:#C2B29E; --line:#3D3227;
    --brand:#2FA58A; --brand-ink:#04160F; --brand-shadow:#1B6B59; --gold:#F2C14E; --sand:#5A4630;
    --ok:#2E9E5B; --ok-bg:#173F2B; --bad:#E0634E; --bad-bg:#4A2420; --note:#3A2F18;
    --path:#C9A06A;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#17130F; --surface:#241D17; --ink:#F3EBDD; --muted:#C2B29E; --line:#3D3227;
  --brand:#2FA58A; --brand-ink:#04160F; --brand-shadow:#1B6B59; --gold:#F2C14E; --sand:#5A4630;
  --ok:#2E9E5B; --ok-bg:#173F2B; --bad:#E0634E; --bad-bg:#4A2420; --note:#3A2F18;
  --path:#C9A06A;
  color-scheme:dark;
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Baloo 2","Trebuchet MS","Segoe UI",system-ui,sans-serif;font-size:18px;line-height:1.45}
.wrap{max-width:720px;margin:0 auto;padding:12px 16px 44px}
button{font:inherit;cursor:pointer;color:inherit}
button:disabled{cursor:default}
:focus-visible{outline:3px solid var(--gold);outline-offset:3px}
svg{max-width:100%}

.topbar{display:flex;justify-content:space-between;align-items:center;gap:10px;min-height:44px}
.iconbtn{background:var(--surface);border:2px solid var(--line);border-radius:999px;width:44px;height:44px;font-size:20px;display:grid;place-items:center;flex:none;padding:0}
.pillstat{display:inline-flex;align-items:center;gap:6px;background:var(--surface);border:2px solid var(--line);border-radius:999px;padding:3px 12px 3px 8px;font-weight:800;font-size:17px}
.kurma{width:16px;height:22px;flex:none}
.stats{display:flex;gap:8px;flex-wrap:wrap}

.hero{text-align:center;padding:10px 0 4px}
.hero .sub{display:inline-block;background:var(--brand);color:var(--brand-ink);border-radius:999px;padding:2px 14px;font-weight:700;font-size:15px}
.hero h1{margin:8px 0 0;font-size:clamp(34px,9vw,52px);line-height:1.02;font-weight:800;color:var(--brand)}
.hero p{margin:8px auto 0;color:var(--muted);max-width:430px}

/* Map */
.map{position:relative;margin:18px auto 0;max-width:520px;border-radius:28px;background:linear-gradient(180deg,color-mix(in srgb,var(--sand) 35%,transparent),color-mix(in srgb,var(--sand) 70%,transparent));border:2px solid var(--line);overflow:hidden}
.map svg.route{position:absolute;inset:0;width:100%;height:100%}
.node{position:absolute;transform:translate(-50%,-50%);display:flex;flex-direction:column;align-items:center;gap:2px;background:none;border:0;padding:0;width:170px;text-align:center}
.node .dot{position:relative;width:84px;height:84px;border-radius:50%;display:grid;place-items:center;font-size:38px;background:var(--tc);color:#fff;box-shadow:0 6px 0 color-mix(in srgb,var(--tc) 65%,#000),0 0 0 5px var(--surface);transition:transform .1s}
.node:active .dot{transform:translateY(3px)}
.node .num{position:absolute;top:-6px;right:-6px;background:var(--surface);color:var(--ink);border:2px solid var(--line);border-radius:999px;font-size:14px;font-weight:800;min-width:28px;height:28px;display:grid;place-items:center;padding:0 6px}
.node .lbl{font-weight:800;font-size:15.5px;line-height:1.15;margin-top:8px;background:var(--surface);border-radius:12px;padding:3px 8px;border:2px solid var(--line)}
.node .st{font-size:14px;letter-spacing:1px}
.node .st .off{opacity:.25;filter:grayscale(1)}
.node.locked .dot{background:#9C9184;box-shadow:0 6px 0 #6E665C,0 0 0 5px var(--surface);font-size:30px}
.node.locked .lbl{opacity:.7}
.node.current .dot{animation:glow 1.8s ease-in-out infinite}
@keyframes glow{50%{box-shadow:0 6px 0 color-mix(in srgb,var(--tc) 65%,#000),0 0 0 9px color-mix(in srgb,var(--gold) 60%,transparent)}}
.kiki{position:absolute;left:0;top:0;width:64px;transform:translate(-50%,-80%);animation:idle 2.6s ease-in-out infinite}
.deco{position:absolute;font-size:26px;opacity:.55;pointer-events:none}
.teacher{display:flex;justify-content:center;margin-top:22px}
.toggle{display:inline-flex;align-items:center;gap:10px;background:var(--surface);border:2px solid var(--line);border-radius:999px;padding:6px 14px;font-size:16px;font-weight:700}
.toggle .sw{width:42px;height:24px;border-radius:99px;background:var(--line);position:relative;flex:none;transition:background .2s}
.toggle .sw::after{content:"";position:absolute;top:3px;left:3px;width:18px;height:18px;border-radius:50%;background:#fff;transition:left .2s}
.toggle[aria-pressed="true"] .sw{background:var(--brand)}
.toggle[aria-pressed="true"] .sw::after{left:21px}
.foot{margin-top:18px;color:var(--muted);font-size:15px;text-align:center}

/* Station */
.banner{border-radius:26px;padding:18px 18px 20px;background:var(--tc);color:#fff;position:relative;overflow:hidden;box-shadow:0 6px 0 color-mix(in srgb,var(--tc) 65%,#000)}
.banner.final{color:#2A1B00}
.banner .kick{font-weight:700;opacity:.9;font-size:16px}
.banner h2{margin:0;font-size:clamp(26px,6.6vw,34px);line-height:1.1}
.banner .big{position:absolute;right:-6px;bottom:-14px;font-size:96px;opacity:.25}
.banner .stars{margin-top:6px;font-size:20px}
.banner .stars .off{opacity:.35;filter:grayscale(1)}
.units{list-style:none;margin:16px 0 0;padding:0;display:grid;gap:8px}
.units li{background:var(--surface);border:2px solid var(--line);border-radius:14px;padding:8px 12px;display:flex;gap:10px;align-items:center;line-height:1.25}
.units .u{background:var(--tc);color:#fff;border-radius:10px;font-size:13px;font-weight:800;padding:2px 8px;flex:none}
.final-units .u{color:#2A1B00}
.actions{display:grid;gap:12px;margin-top:18px}
.bigbtn{display:flex;align-items:center;gap:14px;width:100%;text-align:left;border:0;border-radius:20px;padding:14px 16px;font-weight:800;font-size:21px;line-height:1.15}
.bigbtn small{display:block;font-weight:600;font-size:15px;opacity:.9}
.bigbtn .e{font-size:34px;flex:none}
.bigbtn.read{background:var(--surface);border:2px solid var(--line);box-shadow:0 4px 0 var(--line)}
.bigbtn.play{background:var(--brand);color:var(--brand-ink);box-shadow:0 5px 0 var(--brand-shadow)}
.bigbtn:active{transform:translateY(3px)}

/* Common game */
.gamehead{display:flex;align-items:center;gap:10px;margin:2px 0 10px}
.gamehead h2{margin:0;font-size:20px;flex:1;line-height:1.15;color:var(--brand)}
.gamehead h2 small{display:block;font-size:14px;color:var(--muted);font-weight:600}
.progress{height:12px;background:var(--line);border-radius:99px;overflow:hidden;margin-bottom:14px}
.progress span{display:block;height:100%;background:var(--gold);border-radius:99px;transition:width .3s}
.card{background:var(--surface);border:2px solid var(--line);border-radius:24px;padding:18px}
.page-in{animation:pagein .35s ease}
@keyframes pagein{from{opacity:0;transform:translateX(18px)}to{opacity:1;transform:none}}
.qmeta{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:6px}
.qtype{display:inline-block;background:var(--note);border-radius:999px;padding:1px 12px;font-size:14.5px;font-weight:700}
.tag{display:inline-block;background:var(--gold);color:#2A1B00;border-radius:999px;padding:1px 10px;font-size:13.5px;font-weight:800;margin-left:4px}
.pill{border:2px solid var(--line);background:var(--bg);border-radius:999px;padding:3px 12px;font-size:15px;font-weight:700}
.qtext{font-size:clamp(20px,4.8vw,26px);font-weight:700;line-height:1.32;margin:4px 0 16px}
.blank{display:inline-block;min-width:90px;border-bottom:3px dashed var(--gold);text-align:center;color:var(--muted);padding:0 6px}
.blank.filled{border-bottom-style:solid;color:var(--ok)}
.opts{display:grid;gap:10px}
.opt{display:flex;gap:12px;align-items:center;width:100%;border:2px solid var(--line);background:var(--bg);border-radius:16px;padding:11px 14px;text-align:left;font-size:19px;font-weight:600;line-height:1.3}
.opt .k{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;background:var(--surface);border:2px solid var(--line);flex:none;font-size:16px;font-weight:800}
.opt.ok{border-color:var(--ok);background:var(--ok-bg)}
.opt.ok .k{background:var(--ok);border-color:var(--ok);color:#fff}
.opt.bad{border-color:var(--bad);background:var(--bad-bg)}
.opt.bad .k{background:var(--bad);border-color:var(--bad);color:#fff}
.words{display:flex;flex-wrap:wrap;gap:10px}
.word{border:2px solid var(--line);background:var(--bg);border-radius:14px;padding:9px 16px;font-size:19px;font-weight:700;box-shadow:0 3px 0 var(--line)}
.word.ok{border-color:var(--ok);background:var(--ok-bg)}
.word.bad{border-color:var(--bad);background:var(--bad-bg)}
.tfrow{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.tfrow button{border:0;border-radius:18px;padding:14px 8px;font-size:21px;font-weight:800;color:#fff;line-height:1.15}
.tfrow button span{display:block;font-size:30px}
.tfrow .yes{background:var(--ok);box-shadow:0 4px 0 color-mix(in srgb,var(--ok) 70%,#000)}
.tfrow .no{background:var(--bad);box-shadow:0 4px 0 color-mix(in srgb,var(--bad) 70%,#000)}
.tfrow button:disabled{opacity:.4}
.tfrow button.picked{opacity:1;outline:3px solid var(--gold);outline-offset:3px}

.hint{color:var(--muted);font-size:15.5px;margin:-8px 0 12px}
.slots{list-style:none;margin:0 0 14px;padding:0;display:grid;gap:7px}
.slot{display:flex;gap:10px;align-items:center;min-height:46px;border:2px dashed var(--line);border-radius:14px;padding:6px 12px;line-height:1.25}
.slot .n{width:28px;height:28px;border-radius:50%;background:var(--line);display:grid;place-items:center;font-weight:800;flex:none;font-size:15px}
.slot.filled{border-style:solid;border-color:var(--ok);background:var(--ok-bg);font-weight:700;animation:pop .3s ease}
.slot.filled .n{background:var(--ok);color:#fff}
.chips{display:grid;gap:8px}
.chip{width:100%;border:2px solid var(--line);background:var(--bg);border-radius:14px;padding:9px 14px;text-align:left;font-size:18px;font-weight:700;line-height:1.25;box-shadow:0 3px 0 var(--line)}
.shake{animation:shake .4s;border-color:var(--bad)!important;background:var(--bad-bg)!important}
@keyframes shake{20%{transform:translateX(-7px)}40%{transform:translateX(7px)}60%{transform:translateX(-5px)}80%{transform:translateX(5px)}}
@keyframes pop{50%{transform:scale(1.04)}}

.match{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.match .col{display:grid;gap:8px;align-content:start}
.mbtn{width:100%;min-height:54px;border:2px solid var(--line);background:var(--bg);border-radius:14px;padding:8px 10px;font-size:16.5px;font-weight:700;line-height:1.2;box-shadow:0 3px 0 var(--line)}
.mbtn.sel{border-color:var(--gold);background:var(--note);outline:3px solid var(--gold);outline-offset:1px}
.mbtn.done{color:#fff;border-color:transparent;box-shadow:none;animation:pop .3s ease}

.sortcard{min-height:92px;display:grid;place-items:center;background:var(--note);border:3px dashed var(--gold);border-radius:20px;padding:12px;margin-bottom:12px;text-align:center;font-size:clamp(20px,5vw,25px);font-weight:800;line-height:1.25}
.sortcard .left{display:block;font-size:14px;color:var(--muted);font-weight:600;margin-top:4px}
.buckets{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.bucket{border:0;border-radius:20px;padding:12px 8px 10px;color:#fff;font-weight:800;font-size:18px;line-height:1.2;text-align:center;min-height:140px;display:flex;flex-direction:column;gap:6px;align-items:stretch}
.bucket .bh{display:block}
.bucket .bh span{display:block;font-size:30px}
.bucket.b0{background:#1F6FA8;box-shadow:0 5px 0 #154E78}
.bucket.b1{background:#C0573E;box-shadow:0 5px 0 #8E3E2B}
.bucket .bin{display:flex;flex-wrap:wrap;gap:5px;justify-content:center}
.bucket .bin i{font-style:normal;background:rgba(255,255,255,.92);color:#2B2118;border-radius:10px;padding:1px 8px;font-size:13.5px;font-weight:700}
.bucket .bin i.x{outline:2px solid #FFD34E}
.bucket:active{transform:translateY(3px)}

.feedback{display:flex;gap:12px;align-items:center;margin-top:16px;padding:12px 14px;border-radius:18px;background:var(--note);font-size:17px;line-height:1.4}
.feedback .mascot{width:76px}
.feedback strong{display:block;font-size:21px}
.ref{margin-top:6px;font-size:14.5px;font-weight:700;color:var(--muted)}
.streak{display:inline-block;background:var(--gold);color:#3A2600;border-radius:999px;padding:0 10px;font-weight:800;font-size:15px;margin:2px 0 4px}
.primary{display:block;width:100%;margin-top:14px;border:0;border-radius:16px;padding:13px;background:var(--brand);color:var(--brand-ink);font-size:20px;font-weight:800;box-shadow:0 4px 0 var(--brand-shadow)}
.primary:active{transform:translateY(3px);box-shadow:0 1px 0 var(--brand-shadow)}
.secondary{display:block;width:100%;margin-top:12px;border:2px solid var(--line);background:transparent;border-radius:16px;padding:11px;font-size:18px;font-weight:700}

/* Reading cards */
.scene{border-radius:18px;overflow:hidden;aspect-ratio:2/1;margin:0 0 14px;background:#1A244F}
.scene svg{display:block;width:100%;height:100%}
.unitlbl{display:inline-block;background:var(--tc);color:#fff;border-radius:999px;padding:1px 12px;font-weight:800;font-size:14.5px;margin-bottom:6px}
.final-tc .unitlbl{color:#2A1B00}
.readtext{font-size:clamp(19px,4.4vw,23px);font-weight:600;line-height:1.5;margin:0 0 12px}
.chain{display:flex;flex-direction:column;align-items:center;gap:2px;margin:4px 0 12px}
.chain b{background:var(--note);border:2px solid var(--gold);border-radius:14px;padding:4px 16px;font-size:19px}
.chain b.last{background:var(--brand);color:var(--brand-ink);border-color:var(--brand)}
.chain i{font-style:normal;color:var(--muted);font-size:16px;line-height:1}
.namelist{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 12px;padding:0;list-style:none}
.namelist li{background:var(--note);border:2px solid var(--line);border-radius:12px;padding:3px 10px;font-weight:700;font-size:16.5px}
.navrow{display:grid;grid-template-columns:52px auto 1fr;gap:8px;align-items:center}
.navrow .secondary,.navrow .primary{margin:0;padding:11px 6px;font-size:18px}
.navrow .secondary:disabled{opacity:.35}
.dots{display:flex;justify-content:center;gap:6px;margin-top:12px}
.dots i{width:9px;height:9px;border-radius:50%;background:var(--line)}
.dots i.on{background:var(--gold);width:22px;border-radius:99px}

/* Result */
.result{text-align:center}
.result .mascot{width:120px;margin:0 auto}
.result .stars{font-size:54px;letter-spacing:6px;line-height:1.1;margin:4px 0}
.result .stars .off{filter:grayscale(1);opacity:.25}
.result h2{margin:4px 0 2px;font-size:32px;color:var(--brand)}
.result p{margin:0 0 6px;color:var(--muted)}
.unlock{display:inline-block;margin:8px 0 0;background:var(--note);border:2px solid var(--gold);border-radius:999px;padding:3px 14px;font-weight:800}
.earned{display:inline-flex;align-items:center;gap:6px;font-weight:800;font-size:20px;margin:4px 0}

.rain{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:50}
.rain span{position:absolute;top:-50px;font-size:28px;animation:fall linear forwards}
@keyframes fall{to{transform:translateY(115vh) rotate(300deg)}}

.mascot{display:block;height:auto;flex:none}
.mascot.happy{animation:hop .45s ease 2}
.mascot.sad{animation:tilt .9s ease}
@keyframes hop{50%{transform:translateY(-10px)}}
@keyframes tilt{30%{transform:rotate(-8deg)}70%{transform:rotate(4deg)}}
@keyframes idle{50%{transform:translate(-50%,-86%)}}

/* Scene animation */
.tw{animation:tw 2.6s ease-in-out infinite}
@keyframes tw{50%{opacity:.2}}
.float{animation:float 4s ease-in-out infinite}
@keyframes float{50%{transform:translateY(-4px)}}
.pulse{animation:pulse 3s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
@keyframes pulse{50%{transform:scale(1.08);opacity:.85}}
.drift{animation:drift 26s linear infinite}
@keyframes drift{from{transform:translateX(-70px)}to{transform:translateX(340px)}}
.fly{animation:fly 8s linear infinite}
@keyframes fly{from{transform:translate(-70px,10px)}to{transform:translate(340px,-12px)}}
.walk{animation:walk 18s linear infinite}
@keyframes walk{from{transform:translateX(-150px)}to{transform:translateX(330px)}}
.bob{animation:bob .7s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-1.5px)}}
.sway{animation:sway 4s ease-in-out infinite;transform-box:fill-box;transform-origin:50% 100%}
@keyframes sway{50%{transform:rotate(4deg)}}
.wave{animation:wave 1.4s ease-in-out infinite;transform-box:fill-box;transform-origin:0 50%}
@keyframes wave{50%{transform:skewY(8deg) scaleX(.88)}}
.grazers{animation:graze 3s ease-in-out infinite}
@keyframes graze{50%{transform:translateX(3px)}}

@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{animation:none!important;transition:none!important}
  .rain{display:none}
}
@media (max-width:400px){
  .node{width:150px}
  .node .dot{width:74px;height:74px;font-size:33px}
  .match .mbtn{font-size:15px}
}
</style>
</head>
<body>
<main class="wrap" id="app"></main>

<script>
/* ============ KANDUNGAN (berdasarkan Buku Teks JAIS Sirah Tahun 3) ============ */
// Jenis soalan: mcq (a[0] betul), tf, fill (a[0] betul, q mengandungi ___), order (items ikut urutan betul),
// match (pairs), sort (groups + items [teks, kumpulan]). p = muka surat buku teks.
const TOPICS = [
{
  id:1, title:"Nasab Nabi Muhammad SAW", icon:"🌳", color:"#0F6B5A", pages:"1–8",
  units:["Kemuliaan Bangsa Arab Quraisy","Nasab Nabi SAW Sebelah Bapa","Nasab Nabi SAW Sebelah Ibu","Pertemuan Nasab Bapa dan Ibu Nabi SAW"],
  cards:[
    {u:"Unit 1",sc:"makkah",p:1,t:"Keturunan Nabi Muhammad SAW berasal daripada Nabi Ismail AS. Bangsa Arab Quraisy bersifat pemurah, menepati janji dan mempunyai keazaman yang kuat."},
    {u:"Unit 1",sc:"makkah",p:1,t:"Nama Muhammad bererti “yang terpuji”. Baginda dilahirkan di kota Makkah. Ibunya bernama Aminah binti Wahab dan bapanya Abdullah bin Abdul Muttalib, daripada keturunan bangsawan Quraisy."},
    {u:"Unit 2 • Nasab sebelah bapa",p:3,chain:["Kilab bin Murrah","Qusai","Abdu Manaf","Hasyim","Abdul Muttalib","Abdullah","Muhammad SAW"]},
    {u:"Unit 3 • Nasab sebelah ibu",p:4,chain:["Kilab bin Murrah","Zuhrah","Abdu Manaf","Wahab","Aminah","Muhammad SAW"]},
    {u:"Unit 4 • Pertemuan nasab",sc:"kemah",p:5,t:"Nasab sebelah bapa dan nasab sebelah ibu Nabi SAW bertemu pada Kilab bin Murrah. Tahukah anda? Orang yang baik akan melahirkan keturunan yang baik."}
  ],
  qs:[
    {type:"mcq",q:"Keturunan Nabi Muhammad SAW berasal daripada…",a:["Nabi Ismail AS","Nabi Musa AS","Nabi Isa AS","Nabi Nuh AS"],e:"Keturunan Nabi SAW berasal daripada Nabi Ismail AS.",p:1},
    {type:"mcq",q:"Apakah maksud nama “Muhammad”?",a:["Yang terpuji","Yang dipercayai","Yang pemurah","Yang berani"],e:"Nama Muhammad bererti yang terpuji.",p:1},
    {type:"tf",q:"Bangsa Arab Quraisy terkenal bersifat pemurah dan menepati janji.",ans:true,e:"Betul. Mereka juga mempunyai keazaman yang kuat.",p:1},

{
  id:2, title:"Peristiwa Kelahiran Nabi SAW", icon:"🐘", color:"#1F6FA8", pages:"9–15",
  units:["Peristiwa Sebelum Kelahiran","Peristiwa Semasa Kelahiran","Peristiwa Selepas Kelahiran"],
  cards:[
    {u:"Unit 1 • Sebelum kelahiran",sc:"madinah",p:9,t:"Bapa Nabi SAW, Abdullah, meninggal dunia ketika baginda masih dalam kandungan ibunya. Beliau dikebumikan di Yathrib, yang kemudian dikenali sebagai Madinah."},
    {u:"Unit 1 • Sebelum kelahiran",sc:"gajah",p:9,t:"Tahun kelahiran Nabi SAW dinamakan Tahun Gajah. Pada tahun itu, tentera yang diketuai oleh Abrahah datang ke Makkah dengan menunggang gajah untuk meruntuhkan Kaabah."},
    {u:"Unit 1 • Sebelum kelahiran",sc:"gajah",p:10,t:"Tentera Abrahah dimusnahkan oleh sekumpulan burung yang membawa batu. Ada yang mati di Makkah dan ada yang mati di San’a’, Yaman, termasuk Abrahah sendiri. Kisah ini terdapat dalam Surah Al-Fil."},
    {u:"Unit 2 • Semasa kelahiran",sc:"makkah",p:11,t:"Nabi SAW dilahirkan pada pagi hari Isnin, 12 Rabiulawal Tahun Gajah, bersamaan bulan April 571 Masihi, di kota Makkah. Ketika baginda lahir, keluar cahaya yang menerangi istana-istana di bumi Syam."},
    {u:"Unit 3 • Selepas kelahiran",sc:"kemah",p:12,t:"Nabi SAW disusukan oleh Thuwaibah Al-Aslamiyyah, kemudian oleh Halimah As-Sa’diyyah yang menjaga baginda hingga berumur 4 tahun. Ketika itu, dada baginda dibelah oleh Malaikat Jibril untuk membersihkan hati baginda."},
    {u:"Unit 3 • Selepas kelahiran",sc:"makkah",p:12,t:"Ketika berumur 6 tahun, ibu baginda wafat di Abwa’ semasa pulang dari menziarahi kubur bapanya di Madinah. Ketika baginda berumur 8 tahun, datuknya, Abdul Muttalib, pula meninggal dunia."}
  ],

    {type:"mcq",q:"Di manakah bapa Nabi SAW dikebumikan?",a:["Yathrib","Makkah","Taif","Syam"],e:"Beliau dikebumikan di Yathrib, yang kemudian dikenali sebagai Madinah.",p:9},
    {type:"mcq",q:"Siapakah yang mengetuai tentera bergajah untuk meruntuhkan Kaabah?",a:["Abrahah","Abu Jahal","Abu Lahab","Abdul Muttalib"],e:"Tentera bergajah diketuai oleh Abrahah.",p:9},
    {type:"fill",q:"Tentera Abrahah dimusnahkan oleh sekumpulan ___ yang membawa batu.",a:["burung","unta","semut"],e:"Allah memusnahkan mereka dengan sekumpulan burung yang membawa batu.",p:10},
    {type:"fill",q:"Nabi SAW dilahirkan pada 12 ___ Tahun Gajah.",a:["Rabiulawal","Ramadan","Syawal"],e:"Baginda lahir pada 12 Rabiulawal Tahun Gajah.",p:11},

{
  id:3, title:"Akhlak Nabi Muhammad SAW", icon:"💎", color:"#C0573E", pages:"16–25",
  units:["Akhlak Ketika Kanak-kanak","Akhlak Ketika Remaja","Akhlak Ketika Dewasa","Mendapat Gelaran Al-Amin"],
  cards:[
    {u:"Unit 1 • Kanak-kanak",sc:"kemah",p:17,t:"Nabi SAW dibesarkan di perkampungan Bani Sa’ad di luar kota Makkah. Kaum Bani Sa’ad terkenal kerana fasih berbahasa Arab. Di sana baginda belajar berbudi pekerti mulia, berdikari dan menguasai bahasa dengan baik."},
    {u:"Unit 2 • Remaja",sc:"makkah",p:18,t:"Ketika remaja, Nabi SAW seorang yang berani, amanah dan dipercayai sehingga digelar “Al-Amin” oleh penduduk Makkah. Baginda dipelihara oleh Allah daripada perkara maksiat."},
    {u:"Unit 3 • Dewasa",sc:"madinah",p:19,t:"Ketika dewasa, Nabi SAW bijaksana dalam urusan dakwah dan negara, berani dalam peperangan, jujur dalam perniagaan, sangat menyayangi kanak-kanak dan menghormati orang yang lebih tua."},
    {u:"Unit 4 • Al-Amin",sc:"makkah",p:21,t:"Kisah Hajar Aswad: Ketika Nabi SAW berumur lebih kurang 35 tahun, Kaabah dibaiki semula. Ketua-ketua kaum Quraisy berbalah tentang siapa yang layak meletakkan Hajar Aswad di tempatnya."},
    {u:"Unit 4 • Al-Amin",sc:"makkah",p:21,t:"Umayyah bin Al-Mughirah mencadangkan supaya orang pertama yang masuk ke Masjidil Haram menjadi hakim. Keesokan paginya, Nabi SAW orang pertama yang masuk."},
    {u:"Unit 4 • Al-Amin",sc:"makkah",p:22,t:"Nabi SAW meletakkan Hajar Aswad di atas sehelai kain, lalu meminta semua ketua kaum memegang penjuru kain dan mengangkatnya bersama-sama. Semua kaum berpuas hati."},
    {u:"Tahukah anda?",sc:"masjid",p:24,t:"Sifat wajib bagi Nabi SAW: Siddiq bererti benar, Amanah bererti jujur, Tabligh bererti menyampaikan dan Fatanah bererti bijaksana."}
  ],
  qs:[
    {type:"mcq",q:"Nabi SAW dibesarkan di perkampungan…",a:["Bani Sa’ad","Bani Hasyim","Bani Zuhrah","Bani Umaiyah"],e:"Baginda dibesarkan di perkampungan Bani Sa’ad di luar kota Makkah.",p:17},
    {type:"mcq",q:"Kaum Bani Sa’ad terkenal kerana…",a:["Fasih berbahasa Arab","Kaya-raya","Tentera yang kuat","Pandai berniaga"],e:"Kaum Bani Sa’ad terkenal dengan kefasihan berbahasa Arab.",p:17},
    {type:"mcq",q:"Apakah gelaran Nabi SAW yang bermaksud “orang yang dipercayai”?",a:["Al-Amin","As-Siddiq","Al-Faruq","Saifullah"],e:"Penduduk Makkah menggelar baginda Al-Amin.",p:18},
    {type:"tf",q:"Nabi SAW dipelihara oleh Allah daripada perkara maksiat.",ans:true,e:"Betul. Allah memelihara baginda sejak remaja.",p:18},

    {type:"mcq",q:"Berapakah umur Nabi SAW semasa peristiwa Hajar Aswad?",a:["Lebih kurang 35 tahun","12 tahun","25 tahun","40 tahun"],e:"Peristiwa ini berlaku ketika baginda berumur lebih kurang 35 tahun.",p:21},
    {type:"mcq",q:"Siapakah yang mencadangkan orang pertama masuk ke Masjidil Haram menjadi hakim?",a:["Umayyah bin Al-Mughirah","Abu Talib","Abdul Muttalib","Abu Bakar"],e:"Cadangan itu datang daripada Umayyah bin Al-Mughirah, ketua Quraisy yang tua dan dihormati.",p:21},

{
  id:4, title:"Pekerjaan Nabi Muhammad SAW", icon:"🐐", color:"#8A5A2B", pages:"26–28",
  units:["Nabi SAW Menggembala Kambing","Nabi SAW Berniaga"],
  cards:[
    {u:"Unit 1 • Menggembala kambing",sc:"gembala",p:26,t:"Selepas ibu dan datuknya wafat, Nabi SAW tinggal bersama bapa saudaranya, Abu Talib. Baginda bekerja menggembala kambing kepunyaan penduduk Makkah dan menerima upah untuk menampung kehidupan."},
    {u:"Unit 2 • Berniaga",sc:"unta",p:27,t:"Ketika berumur 12 tahun, Nabi SAW pergi ke Syam untuk berniaga bersama bapa saudaranya, Abu Talib."},
    {u:"Unit 2 • Berniaga",sc:"unta",p:27,t:"Ketika berumur 25 tahun, baginda ke Syam lagi sebagai ketua rombongan, membawa barang dagangan Khadijah. Baginda ditemani khadam Khadijah bernama Maisarah. Baginda berniaga dengan jujur dan mendapat keuntungan yang besar."},
    {u:"Tahukah anda?",sc:"unta",p:28,t:"Nabi SAW berjaya berniaga kerana sentiasa jujur, amanah dan mesra dengan pelanggan. Amalkan doa “Rabbi yassir wa la tu’assir” supaya dipermudahkan segala urusan."}
  ],
  qs:[

    {type:"mcq",q:"Apakah pekerjaan Nabi SAW di Makkah dalam Unit 1?",a:["Menggembala kambing","Bertani","Menangkap ikan","Menjahit baju"],e:"Baginda menggembala kambing kepunyaan penduduk Makkah.",p:26},
    {type:"tf",q:"Nabi SAW menerima upah daripada kerja menggembala kambing.",ans:true,e:"Betul. Upah itu digunakan untuk menampung kehidupan baginda.",p:26},

    {type:"fill",q:"Ketika berumur 25 tahun, Nabi SAW membawa barang dagangan milik ___ ke Syam.",a:["Khadijah","Abu Talib","Maisarah"],e:"Baginda membawa barang dagangan Khadijah.",p:27},
    {type:"mcq",q:"Siapakah khadam Khadijah yang menemani Nabi SAW berniaga?",a:["Maisarah","Halimah","Bilal","Zaid"],e:"Baginda ditemani oleh Maisarah.",p:27},
    {type:"match",q:"Padankan nama dengan keterangannya.",pairs:[["Abu Talib","Bapa saudara Nabi SAW"],["Khadijah","Pemilik barang dagangan"],["Maisarah","Khadam Khadijah"],["Syam","Tempat berniaga"]],e:"Abu Talib menjaga baginda. Baginda membawa barang Khadijah ke Syam bersama Maisarah.",p:27},
    {type:"sort",q:"Asingkan sifat peniaga.",groups:["Peniaga yang baik","Peniaga yang tidak baik"],items:[["Jujur",0],["Amanah",0],["Mesra dengan pelanggan",0],["Menipu timbangan",1],["Sombong",1],["Mungkir janji",1]],e:"Nabi SAW berjaya kerana jujur, amanah dan mesra dengan pelanggan.",p:28},

{
  id:5, title:"Kehidupan Bermasyarakat Nabi SAW", icon:"🤝", color:"#5B4BB7", pages:"29–33",
  units:["Cara Pergaulan Nabi SAW","Pergaulan Nabi SAW dengan Sahabat"],
  cards:[
    {u:"Unit 1 • Cara pergaulan",sc:"masjid",p:29,t:"Nabi SAW bergaul dengan semua lapisan masyarakat: orang Islam atau bukan Islam, orang kaya atau miskin. Baginda menghormati orang tua dan menyayangi kanak-kanak. Baginda lemah lembut dan pengasih kepada semua makhluk Allah."},
    {u:"Unit 1 • Cara pergaulan",sc:"badar",p:29,t:"Nabi SAW mendengar pendapat sahabat. Dalam Perang Khandaq, baginda menerima cadangan Salman Al-Farisi untuk menggali parit."},
    {u:"Unit 2 • Dengan sahabat",sc:"badar",p:30,t:"Dalam Perang Badar, sahabat bernama Al-Hubab bin Al-Munzir mencadangkan tentera Islam berkhemah dekat punca air. Nabi SAW bersetuju, dan tentera Islam mendapat kemenangan. Nabi SAW menghargai pendapat sahabat walaupun daripada tentera biasa."},
    {u:"Sifat ketika bergaul",p:31,list:["Memuliakan orang lain","Jujur dalam bicara","Menerima pendapat","Merendah diri","Tidak memalukan orang","Berlapang dada","Tidak memotong percakapan","Memanggil dengan nama yang baik"]},
    {u:"Tahukah anda? • 10 sahabat dijamin syurga",p:32,list:["Abu Bakar As-Siddiq","Umar Al-Khattab","Uthman bin Affan","Ali bin Abi Talib","Talhah bin Ubaidillah","Az-Zubair bin Al-Awwam","Abdul Rahman bin Auf","Saad bin Abi Waqqas","Said bin Zaid","Abu Ubaidah bin Al-Jarrah"]},
    {u:"Hadis Nabi SAW",sc:"masjid",p:33,t:"Daripada Abu Hurairah RA, Rasulullah SAW bersabda: “Sesungguhnya aku diutuskan untuk menyempurnakan akhlak yang mulia.” (Riwayat Imam Malik). Amalkan: beri salam dan bersalaman apabila bertemu sahabat."}
  ],
  qs:[

    {type:"tf",q:"Nabi SAW menolak pendapat Al-Hubab kerana dia hanya tentera biasa.",ans:false,e:"Salah. Nabi SAW bersetuju dengan cadangannya dan tentera Islam menang.",p:30},
    {type:"match",q:"Padankan sahabat dengan peristiwanya.",pairs:[["Salman Al-Farisi","Menggali parit (Khandaq)"],["Al-Hubab bin Al-Munzir","Khemah dekat air (Badar)"],["Abu Hurairah","Meriwayatkan hadis akhlak mulia"]],e:"Nabi SAW mendengar dan menghargai pendapat para sahabat.",p:30},

{
  id:6, title:"Rumah Tangga Nabi SAW", icon:"🏡", color:"#D9577A", pages:"34–40",
  units:["Sifat Mulia Nabi SAW dalam Berkeluarga","Sifat Mulia Nabi SAW Terhadap Isteri","Sifat Mulia Nabi SAW Terhadap Mertua","Sifat Mulia Nabi SAW Terhadap Anak-anak"],
  cards:[
    {u:"Unit 1 • Berkeluarga",sc:"rumah",p:34,t:"Nabi SAW berkahwin dengan Khadijah ketika berumur 25 tahun. Rumah tangga baginda penuh kasih sayang. Walaupun isterinya hartawan, baginda hidup secara sederhana dan suka membantu fakir miskin."},
    {u:"Unit 1 • Berkeluarga",sc:"rumah",p:34,t:"Nabi SAW bertutur lemah lembut dan berbincang dengan keluarga. Baginda suka bergurau dengan isteri, anak dan cucu. Bersama Khadijah, baginda dikurniakan 2 orang anak lelaki dan 4 orang anak perempuan."},
    {u:"Unit 2 • Terhadap isteri",sc:"rumah",p:35,t:"Nabi SAW bersopan santun, lemah lembut dan sabar terhadap isteri. Baginda membantu kerja rumah dan hidup bersederhana, seperti menampal kasut, menjahit baju sendiri dan ke pasar membeli barang keperluan."},
    {u:"Unit 2 • Isteri-isteri Nabi SAW",p:36,list:["Khadijah binti Khuwailid","Saudah binti Zam’ah","Aisyah binti Abu Bakar","Hafsah binti Umar","Zainab binti Khuzaimah","Ummu Salamah","Zainab binti Jahsy","Juwairiyah binti Al-Harith","Ummu Habibah","Safiyyah binti Huyai","Maimunah binti Al-Harith"]},
    {u:"Unit 3 • Terhadap mertua",sc:"madinah",p:38,t:"Nabi SAW melayan mertuanya dengan baik, sopan dan penuh kemesraan, seperti seorang sahabat. Baginda menghormati mertuanya seperti Saidina Abu Bakar dan Saidina Umar RA."},
    {u:"Unit 4 • Anak dan cucu",p:37,list:["Anak: Qasim","Zainab","Ruqayyah","Ummu Kalthum","Fatimah","Abdullah","Ibrahim","Cucu: Hasan","Husain","Umamah"]},
    {u:"Unit 4 • Terhadap anak-anak",sc:"rumah",p:40,t:"Nabi SAW sopan, lemah lembut dan penuh kasih sayang kepada anak-anak. Apabila Fatimah datang, baginda menyambutnya dengan mesra: “Selamat datang, puteriku,” lalu menyuruhnya duduk di sebelah kanan baginda."}
  ],

let actx;
function tone(freqs, dur=0.12, type="sine"){
  if(muted) return;
  try{
    actx = actx || new (window.AudioContext||window.webkitAudioContext)();
    const t = actx.currentTime;
    freqs.forEach((f,i)=>{
      const o=actx.createOscillator(), g=actx.createGain();
      o.type=type; o.frequency.value=f;
      const s=t+i*dur;
      g.gain.setValueAtTime(0.0001,s);
      g.gain.exponentialRampToValueAtTime(0.18,s+0.02);
      g.gain.exponentialRampToValueAtTime(0.0001,s+dur);
      o.connect(g).connect(actx.destination);
      o.start(s); o.stop(s+dur+0.02);
    });
  }catch(e){}
}
const sfx = { ok:()=>tone([660,880]), bad:()=>tone([240,180],0.15,"triangle"), tap:()=>tone([520],0.06,"triangle"), win:()=>tone([523,659,784,1047],0.14) };
const ttsOK = "speechSynthesis" in window && "SpeechSynthesisUtterance" in window;
let voice = null;
function pickVoice(){ try{ const vs=speechSynthesis.getVoices(); voice = vs.find(v=>/^ms/i.test(v.lang)) || vs.find(v=>/^id/i.test(v.lang)) || null; }catch(e){} }
if(ttsOK){ pickVoice(); try{ speechSynthesis.onvoiceschanged = pickVoice; }catch(e){} }
function speak(text){
  if(!ttsOK) return;
  try{
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text.replace(/\bSAW\b/g,"sallallahu alaihi wasallam").replace(/\bAS\b/g,"alaihissalam").replace(/\bRA\b/g,"radhiallahu anhu").replace(/___/g,"tempat kosong").replace(/[“”]/g,""));
    u.lang = voice ? voice.lang : "ms-MY";
    if(voice) u.voice = voice;
    u.rate = 0.9;
    speechSynthesis.speak(u);
  }catch(e){}
}
function hush(){ if(ttsOK){ try{ speechSynthesis.cancel(); }catch(e){} } }

function renderMap(){
  hush(); run = null;
  const nodes = [...TOPICS.map((t,i)=>({t,i})), {final:true}];
  const rowH = 150, H = nodes.length*rowH + 30;
  const xs = nodes.map((_,i)=> i%2===0 ? 30 : 70);
  const ys = nodes.map((_,i)=> i*rowH + rowH/2 + 10);
  let d = `M ${xs[0]} ${ys[0]}`;
  for(let i=1;i<nodes.length;i++){ d += ` C ${xs[i-1]} ${ys[i-1]+rowH*.55}, ${xs[i]} ${ys[i]-rowH*.55}, ${xs[i]} ${ys[i]}`; }
  let current = TOPICS.findIndex(t=>best[t.id]<1);
  if(current<0) current = TOPICS.length;
  if(current<TOPICS.length && !unlocked(current)) current = -1;

  const nodeHTML = nodes.map((n,i)=>{
    const x = xs[i], y = ys[i];
    if(n.final){
      const open = finalUnlocked();
      return `<button class="node ${open?"":"locked"} ${current===TOPICS.length?"current":""}" style="left:${x}%;top:${y}px;--tc:${FINAL.color}" data-act="station" data-i="final" ${open?"":`aria-label="Cabaran Akhir dikunci. Lulus semua pelajaran dahulu."`}>
        <span class="dot">${open?FINAL.icon:"🔒"}</span>
        <span class="lbl">Cabaran Akhir<br><small style="font-weight:600">Semua tajuk</small></span>
        <span class="st">${starsHTML(best.final)}</span></button>`;
    }
    const t = n.t, open = unlocked(n.i);
    return `<button class="node ${open?"":"locked"} ${current===n.i?"current":""}" style="left:${x}%;top:${y}px;--tc:${t.color}" data-act="station" data-i="${n.i}" ${open?"":`aria-label="Pelajaran ${t.id} dikunci"`}>
      <span class="dot">${open?t.icon:"🔒"}<span class="num">${t.id}</span></span>
      <span class="lbl">${t.title}</span>
      <span class="st">${starsHTML(best[t.id])}</span></button>`;
  }).join("");
  const kiki = current>=0 ? `<div style="position:absolute;width:64px;height:60px;left:${xs[current] + (current%2===0?24:-24)}%;top:${ys[current]-4}px;pointer-events:none">${mascot("idle","kiki")}</div>` : "";
  const deco = [[8,ys[0]+60,"🌴"],[90,ys[1]+70,"🌵"],[10,ys[2]+70,"🐪"],[88,ys[3]+60,"🌴"],[8,ys[4]+70,"🌴"],[90,ys[5]+70,"⛺"]].map(([x,y,e])=>`<span class="deco" style="left:${x}%;top:${y}px" aria-hidden="true">${e}</span>`).join("");

  app.innerHTML = `
    <div class="topbar">
      <div class="stats"><span class="pillstat" aria-label="${kurmaTotal} kurma">${KURMA} ${kurmaTotal}</span><span class="pillstat" aria-label="${totalStars()} bintang">⭐ ${totalStars()}</span></div>
      ${muteBtn()}
    </div>
    <header class="hero">
      <span class="sub">Sirah Tahun 3 • KAFA</span>
      <h1>Pengembaraan Sirah</h1>
      <p>Ikut Kiki merentasi padang pasir! Lulus setiap pelajaran untuk membuka pelajaran seterusnya, dan kumpul kurma untuk setiap jawapan betul.</p>
    </header>
    <div class="map" style="height:${H}px">
      <svg class="route" viewBox="0 0 100 ${H}" preserveAspectRatio="none" aria-hidden="true"><path d="${d}" fill="none" stroke="var(--path)" stroke-width="7" stroke-linecap="round" stroke-dasharray="2 14" vector-effect="non-scaling-stroke"/></svg>
      ${deco}${nodeHTML}${kiki}
    </div>
    <div class="teacher"><button class="toggle" data-act="teacher" aria-pressed="${teacher}"><span class="sw" aria-hidden="true"></span>Mod guru: buka semua tajuk</button></div>
    <p class="foot">Kandungan berdasarkan Buku Teks Sirah Tahun 3 (JAIS). Setiap soalan menunjukkan muka surat rujukan.</p>`;
}

/* ============ STESEN ============ */

      <div class="actions"><button class="bigbtn play" data-act="play"><span class="e" aria-hidden="true">🎮</span><span>Mula Cabaran Akhir<small>${FINAL.qs.length} soalan keseluruhan</small></span></button></div>`;

  }
  const t = TOPICS[+key];
  app.innerHTML = `
    <div class="topbar"><button class="iconbtn" data-act="map" aria-label="Kembali ke peta">←</button>${muteBtn()}</div>

      <div class="kick">Pelajaran ${t.id} • Buku teks ms. ${t.pages}</div><h2>${t.title}</h2>
      <div class="stars">${starsHTML(best[t.id])}</div><span class="big" aria-hidden="true">${t.icon}</span>
    </div>
    <ul class="units" style="--tc:${t.color}">${t.units.map((u,i)=>`<li><span class="u">Unit ${i+1}</span>${u}</li>`).join("")}</ul>
    <div class="actions">
      <button class="bigbtn read" data-act="read"><span class="e" aria-hidden="true">📖</span><span>Baca Dulu<small>${t.cards.length} kad ringkasan bergambar</small></span></button>
      <button class="bigbtn play" data-act="play"><span class="e" aria-hidden="true">🎮</span><span>Mula Cabaran<small>${t.qs.length} soalan khusus Pelajaran ${t.id}</small></span></button>
    </div>`;

function toastLocked(msg){
  const t=document.createElement("div");
  t.setAttribute("role","status");
  t.style.cssText="position:fixed;left:50%;bottom:calc(18px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:18px;font-weight:700;z-index:60;max-width:92vw;text-align:center";
  t.textContent="🔒 "+msg; document.body.appendChild(t); sfx.bad();
  setTimeout(()=>t.remove(),2800);
}

/* ============ BACA DULU ============ */
function startRead(){ run.c = 0; showCard(); }
function showCard(){
  hush();
  const t = TOPICS[+run.station], c = t.cards[run.c], n = t.cards.length;
  run.say = c.t || (c.chain ? c.chain.join(", ") : c.list.join(", "));
  let body = "";
  if(c.sc) body += `<div class="scene">${scene(c.sc)}</div>`;
  body += `<span class="unitlbl">${c.u}</span>`;
  if(c.chain) body += `<div class="chain">${c.chain.map((x,i)=>`${i?`<i aria-hidden="true">▼</i>`:""}<b class="${i===c.chain.length-1?"last":""}">${x}</b>`).join("")}</div>`;
  if(c.list) body += `<ul class="namelist">${c.list.map(x=>`<li>${x}</li>`).join("")}</ul>`;
  if(c.t) body += `<p class="readtext">${c.t}</p>`;
  body += `<p class="ref" style="margin:-4px 0 12px">📖 Buku teks ms. ${c.p}</p>`;
  app.innerHTML = `
    <div class="gamehead"><button class="iconbtn" data-act="station-back" aria-label="Kembali">←</button><h2>Baca Dulu<small>Pelajaran ${t.id}: ${t.title}</small></h2>${muteBtn()}</div>
    <div class="progress"><span style="width:${Math.round((run.c+1)/n*100)}%"></span></div>
    <div class="card page-in" style="--tc:${t.color}">
      ${body}
      <div class="navrow">
        <button class="secondary" data-act="cprev" aria-label="Kad sebelum" ${run.c===0?"disabled":""}>◀</button>
        ${ttsOK?`<button class="pill" data-act="say" style="padding:9px 12px">🔊 Dengar</button>`:"<span></span>"}
        <button class="primary" data-act="cnext">${run.c+1<n?"Seterusnya":"Mula Cabaran 🎮"}</button>
      </div>
      <div class="dots" aria-hidden="true">${[...Array(n)].map((_,i)=>`<i class="${i===run.c?"on":""}"></i>`).join("")}</div>
    </div>`;
}

/* ============ CABARAN ============ */
function startPlay(){
  const isFinal = run.station==="final";
  const src = isFinal ? FINAL.qs : TOPICS[+run.station].qs;
  run = Object.assign(run, {qs:shuffle(src), i:0, score:0, kurma:0, streak:0});
  showQ();
}
function qTitle(){
  if(run.station==="final") return `Cabaran Akhir<small>Soalan keseluruhan • Pelajaran 1–6</small>`;
  const t = TOPICS[+run.station];
  return `Pelajaran ${t.id}<small>Soalan khusus: ${t.title}</small>`;
}
function showQ(){
  hush();
  const q = run.qs[run.i];
  run.q = q; run.done = false; run.mist = 0;
  let body = "", qtext = q.q;
  run.say = q.q;
  switch(q.type){
    case "mcq":
      run.opts = shuffle(q.a.map((t,i)=>({t,ok:i===0})));
      run.say += ". " + run.opts.map((o,k)=>"ABCD"[k]+", "+o.t).join(". ");
      body = `<div class="opts">${run.opts.map((o,k)=>`<button class="opt" data-act="mc" data-k="${k}"><span class="k">${"ABCD"[k]}</span><span>${o.t}</span></button>`).join("")}</div>`;
      break;
    case "fill":
      run.opts = shuffle(q.a.map((t,i)=>({t,ok:i===0})));
      qtext = q.q.replace("___", `<span class="blank" id="blank">?</span>`);
      run.say += ". Pilihan: " + run.opts.map(o=>o.t).join(", ");
      body = `<p class="hint">Pilih perkataan yang betul.</p><div class="words">${run.opts.map((o,k)=>`<button class="word" data-act="fill" data-k="${k}">${o.t}</button>`).join("")}</div>`;
      break;
    case "tf":
      body = `<div class="tfrow"><button class="yes" data-act="tf" data-v="1"><span aria-hidden="true">✅</span>Betul</button><button class="no" data-act="tf" data-v="0"><span aria-hidden="true">❌</span>Salah</button></div>`;
      break;
    case "order":
      run.next = 0;
      body = `<p class="hint">Tekan mengikut urutan, bermula dengan yang pertama.</p>
        <ol class="slots">${q.items.map((_,i)=>`<li class="slot" id="s${i}"><span class="n">${i+1}</span><span class="st"></span></li>`).join("")}</ol>
        <div class="chips">${shuffle(q.items.map((t,i)=>({t,i}))).map(o=>`<button class="chip" data-act="ord" data-i="${o.i}">${o.t}</button>`).join("")}</div>`;
      break;
    case "match":
      run.sel = null; run.matched = 0;
      body = `<p class="hint">Tekan satu kotak di kiri, kemudian pasangannya di kanan.</p>
        <div class="match">
          <div class="col">${shuffle(q.pairs.map((p,i)=>({t:p[0],i}))).map(o=>`<button class="mbtn" data-act="ml" data-i="${o.i}">${o.t}</button>`).join("")}</div>
          <div class="col">${shuffle(q.pairs.map((p,i)=>({t:p[1],i}))).map(o=>`<button class="mbtn" data-act="mr" data-i="${o.i}">${o.t}</button>`).join("")}</div>
        </div>`;
      break;
    case "sort":
      run.queue = shuffle(q.items); run.si = 0;
      body = `<div class="sortcard" id="sortcard"></div>
        <div class="buckets">${q.groups.map((g,k)=>`<button class="bucket b${k}" data-act="srt" data-g="${k}"><span class="bh"><span aria-hidden="true">${k?"🧺":"🧺"}</span>${g}</span><span class="bin" id="bin${k}"></span></button>`).join("")}</div>`;
      break;
  }
  const tag = q.tag ? `<span class="tag">${q.tag}</span>` : "";
  app.innerHTML = `
    <div class="gamehead"><button class="iconbtn" data-act="station-back" aria-label="Kembali">←</button><h2>${qTitle()}</h2><span class="pillstat" aria-label="${run.kurma} kurma">${KURMA} ${run.kurma}</span></div>
    <div class="progress" role="progressbar" aria-valuemin="0" aria-valuemax="${run.qs.length}" aria-valuenow="${run.i}"><span style="width:${Math.round(run.i/run.qs.length*100)}%"></span></div>
    <div class="card page-in">
      <div class="qmeta"><span><span class="qtype">${TYPE_LBL[q.type]}</span>${tag}</span><span style="display:flex;gap:6px;align-items:center"><span class="qnum" style="color:var(--muted);font-size:15px">${run.i+1}/${run.qs.length}</span>${ttsOK?`<button class="pill" data-act="say" aria-label="Dengar soalan">🔊</button>`:""}</span></div>
      <p class="qtext">${qtext}</p>
      ${body}
      <div id="fb" aria-live="polite"></div>
    </div>`;
  if(q.type==="sort") showSortItem();
}

function finishQ(ok, extra=""){
  run.done = true;
  if(ok){ run.score++; run.kurma++; run.streak++; } else run.streak = 0;
  const q = run.q, last = run.i+1 >= run.qs.length;
  const title = ok ? (run.mist ? "Bagus, hampir sempurna!" : pick(PRAISE)) : "Belum tepat, tak apa!";
  $("fb").innerHTML = `<div class="feedback">${mascot(ok?"happy":"sad")}<div><strong>${title}</strong>${ok?`<span class="streak">+1 ${KURMA.replace('class="kurma"','class="kurma" style="width:12px;height:16px;vertical-align:-2px"')} kurma</span> `:""}${ok&&run.streak>=3?`<span class="streak">🔥 ${run.streak} berturut-turut!</span>`:""}<br>${extra}${q.e}<div class="ref">📖 Rujuk buku teks ms. ${q.p}</div></div></div>
    <button class="primary" data-act="next">${last?"Lihat keputusan":"Soalan seterusnya"}</button>`;
  ok ? sfx.ok() : sfx.bad();
  const b = $("fb").querySelector(".primary"); b.focus({preventScroll:true}); b.scrollIntoView({block:"nearest",behavior:"smooth"});
}

function ansChoice(k, sel){
  if(run.done) return;
  const btns = [...app.querySelectorAll(sel)];
  btns.forEach(b=>b.disabled=true);
  const right = run.opts.findIndex(o=>o.ok), ok = k===right;
  btns[right].classList.add("ok");
  if(!ok) btns[k].classList.add("bad");
  if(run.q.type==="fill"){ const bl=$("blank"); bl.textContent=run.opts[right].t; bl.classList.add("filled"); }
  hush(); finishQ(ok);
}
function ansTF(btn){
  if(run.done) return;
  app.querySelectorAll(".tfrow button").forEach(b=>b.disabled=true);
  btn.classList.add("picked");
  const chose = btn.dataset.v==="1", ok = chose===run.q.ans;
  hush(); finishQ(ok, `Jawapan: <b>${run.q.ans?"Betul":"Salah"}</b>. `);
}
function ansOrder(b){
  if(run.done) return;
  const i = +b.dataset.i;
  if(i===run.next){
    sfx.tap();
    const s=$("s"+i); s.classList.add("filled"); s.querySelector(".st").textContent = run.q.items[i];
    b.remove(); run.next++;
    if(run.next===run.q.items.length) finishQ(run.mist<=1);
  } else { run.mist++; sfx.bad(); app.querySelectorAll(".chip.shake").forEach(x=>x.classList.remove("shake")); void b.offsetWidth; b.classList.add("shake"); }
}
function ansMatch(b, side){
  if(run.done || b.classList.contains("done")) return;
  if(side==="l"){
    app.querySelectorAll('.mbtn[data-act="ml"]').forEach(x=>x.classList.remove("sel"));
    b.classList.add("sel"); run.sel = b; sfx.tap(); return;
  }
  if(!run.sel){ b.classList.remove("shake"); void b.offsetWidth; b.classList.add("shake"); return; }
  if(run.sel.dataset.i === b.dataset.i){
    const c = MATCH_COLORS[run.matched % MATCH_COLORS.length];
    [run.sel,b].forEach(x=>{ x.classList.remove("sel"); x.classList.add("done"); x.style.background=c; x.disabled=true; });
    run.sel = null; run.matched++; sfx.tap();
    if(run.matched===run.q.pairs.length) finishQ(run.mist<=1);
  } else {
    run.mist++; sfx.bad();
    app.querySelectorAll(".mbtn.shake").forEach(x=>x.classList.remove("shake")); void b.offsetWidth; b.classList.add("shake");
  }
}
function showSortItem(){
  const it = run.queue[run.si];
  $("sortcard").innerHTML = `<span>${it[0]}<span class="left">${run.queue.length-run.si} lagi • Tekan bakul yang betul</span></span>`;
  $("sortcard").classList.remove("page-in"); void $("sortcard").offsetWidth; $("sortcard").classList.add("page-in");
}
function ansSort(btn){
  if(run.done) return;
  const it = run.queue[run.si], g = +btn.dataset.g;
  const ok = g===it[1];
  if(ok) sfx.tap(); else { run.mist++; sfx.bad(); const c=$("sortcard"); c.classList.remove("shake"); void c.offsetWidth; c.classList.add("shake"); }
  $("bin"+it[1]).insertAdjacentHTML("beforeend", `<i class="${ok?"":"x"}">${ok?"":"❗"}${it[0]}</i>`);
  run.si++;
  if(run.si>=run.queue.length){ $("sortcard").innerHTML = `<span>Siap! ✔️</span>`; app.querySelectorAll(".bucket").forEach(b=>b.disabled=true); finishQ(run.mist<=1, run.mist?`Item bertanda ❗ diletakkan semula ke bakul yang betul. `:""); }
  else setTimeout(showSortItem, ok?120:600);
}

function nextQ(){
  run.i++;
  if(run.i < run.qs.length){ showQ(); window.scrollTo(0,0); }
  else finishRound();
}
function finishRound(){
  hush();
  const key = run.station==="final" ? "final" : TOPICS[+run.station].id;
  const n = run.qs.length, s = run.score, pct = s/n;
  const stars = pct>=0.9?3:pct>=0.7?2:pct>=0.5?1:0;
  const wasFinalOpen = finalUnlocked();
  const nextIdx = run.station==="final" ? -1 : +run.station+1;
  const wasNextOpen = nextIdx>0 && nextIdx<TOPICS.length ? unlocked(nextIdx) : true;
  const prev = best[key];
  if(stars>prev){ best[key]=stars; save("s3-best",best); }
  kurmaTotal += run.kurma; save("s3-kurma",kurmaTotal);
  let unlockMsg = "";
  if(nextIdx>0 && nextIdx<TOPICS.length && !wasNextOpen && unlocked(nextIdx)) unlockMsg = `🔓 Pelajaran ${nextIdx+1} kini dibuka!`;
  if(run.station!=="final" && !wasFinalOpen && finalUnlocked()) unlockMsg = `🔓 Cabaran Akhir kini dibuka!`;
  const titles = ["Jom cuba sekali lagi","Boleh cuba lagi","Bagus!","Cemerlang!"];
  const label = run.station==="final" ? "Cabaran Akhir (semua tajuk)" : `Pelajaran ${key}: ${TOPICS[+run.station].title}`;
  app.innerHTML = `
    <div class="card result page-in" style="margin-top:18px">
      ${mascot(stars>=2?"happy":"idle")}
      <p style="margin:4px 0 0">${label}</p>
      <div class="stars" role="img" aria-label="${stars} daripada 3 bintang">${starsHTML(stars)}</div>
      <h2>${titles[stars]}</h2>
      <p>Kamu menjawab ${s} daripada ${n} soalan dengan betul.</p>
      <div class="earned">+${run.kurma} ${KURMA} kurma</div>
      ${stars>prev?`<p>Rekod baharu!</p>`:""}
      ${stars===0?`<p>Dapatkan sekurang-kurangnya 1 bintang (separuh betul) untuk membuka pelajaran seterusnya. Cuba “Baca Dulu” sebelum mencuba lagi.</p>`:""}
      ${unlockMsg?`<div class="unlock">${unlockMsg}</div>`:""}
      ${run.station==="final"&&stars===3?`<div class="unlock">🏆 Tahniah! Kamu juara Sirah Tahun 3!</div>`:""}
      <button class="primary" data-act="again">Main lagi</button>
      <button class="secondary" data-act="map">Kembali ke peta</button>
    </div>`;
  sfx.win();
  if(stars===3) rain();
  window.scrollTo(0,0);
}
function rain(){
  const box = document.createElement("div"); box.className = "rain";
  for(let i=0;i<28;i++){
    const s = document.createElement("span");
    s.textContent = pick(["⭐","✨","🌙","🌴"]);
    s.style.left = Math.random()*100+"vw";
    s.style.animationDuration = (2+Math.random()*2)+"s";
    s.style.animationDelay = (Math.random()*0.8)+"s";
    box.appendChild(s);
  }
  document.body.appendChild(box);
  setTimeout(()=>box.remove(), 4500);
}

/* ============ EVENTS ============ */
app.addEventListener("click", e=>{
  const b = e.target.closest("button");
  if(!b || b.disabled) return;
  switch(b.dataset.act){
    case "mute": muted=!muted; save("s3-muted",muted); b.textContent=muted?"🔇":"🔊"; b.setAttribute("aria-label",muted?"Hidupkan bunyi":"Matikan bunyi"); if(muted) hush(); break;
    case "teacher": teacher=!teacher; save("s3-teacher",teacher); renderMap(); break;
    case "map": renderMap(); window.scrollTo(0,0); break;
    case "station": openStation(b.dataset.i); window.scrollTo(0,0); break;
    case "station-back": openStation(run.station); window.scrollTo(0,0); break;
    case "read": startRead(); window.scrollTo(0,0); break;
    case "cprev": if(run.c>0){ run.c--; showCard(); } break;
    case "cnext": { const n=TOPICS[+run.station].cards.length; if(run.c+1<n){ run.c++; showCard(); } else startPlay(); window.scrollTo(0,0); break; }
    case "play": startPlay(); window.scrollTo(0,0); break;
    case "say": if(run && run.say) speak(run.say); break;
    case "mc": ansChoice(+b.dataset.k, ".opt"); break;
    case "fill": ansChoice(+b.dataset.k, ".word"); break;
    case "tf": ansTF(b); break;
    case "ord": ansOrder(b); break;
    case "ml": ansMatch(b,"l"); break;
    case "mr": ansMatch(b,"r"); break;
    case "srt": ansSort(b); break;
    case "next": nextQ(); break;
    case "again": startPlay(); window.scrollTo(0,0); break;
  }
});

renderMap();
</script>
</body>
</html>
